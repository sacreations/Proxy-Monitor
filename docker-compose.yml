services:
  proxy-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxy-monitor
    ports:
      - "${PORT:-8087}:8087"
    environment:
      - PORT=8087
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"
        reservations:
          memory: 32M
          cpus: "0.10"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
